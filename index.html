<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bubble Shooter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%, #1a0a2e 0%, #0a0a1a 100%);
  font-family:'Nunito',sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  user-select:none;
}

/* ── Stars background ── */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle linear infinite;}
@keyframes twinkle{0%,100%{opacity:.8;transform:scale(1);}50%{opacity:.2;transform:scale(.5);}}

/* ── Screens ── */
.screen{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;
  background:rgba(10,5,30,0.93);
}
.screen.hidden{display:none;}

.big-title{
  font-family:'Fredoka One',cursive;
  font-size:clamp(42px,8vw,72px);
  background:linear-gradient(135deg,#a78bfa,#f0abfc,#818cf8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:3px;
}
.level-badge{
  font-family:'Fredoka One',cursive;
  font-size:22px;color:#a78bfa;letter-spacing:2px;
}

/* Level cards */
.level-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:10px;max-width:340px;padding:0 8px;
}
.lvl-card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(167,139,250,0.3);
  border-radius:12px;padding:12px 6px;text-align:center;
  cursor:pointer;transition:all .2s;
}
.lvl-card:hover,.lvl-card:active{
  background:rgba(167,139,250,0.2);
  border-color:#a78bfa;transform:scale(1.05);
}
.lvl-card .num{
  font-family:'Fredoka One',cursive;font-size:26px;color:#f0abfc;
}
.lvl-card .stars{font-size:13px;letter-spacing:1px;}
.lvl-card .tag{font-size:10px;color:#8b7ea8;margin-top:2px;}

/* Buttons */
.btn{
  font-family:'Fredoka One',cursive;font-size:22px;letter-spacing:2px;
  border:none;border-radius:12px;padding:13px 32px;cursor:pointer;
  transition:filter .2s,transform .1s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;}
.btn-primary:hover{filter:brightness(1.2);}
.btn-secondary{background:rgba(255,255,255,.08);color:#c4b5fd;border:1px solid rgba(167,139,250,.4);}
.btn-secondary:hover{filter:brightness(1.3);}

.result-title{font-family:'Fredoka One',cursive;font-size:40px;}
.result-sub{font-size:18px;color:#c4b5fd;text-align:center;max-width:280px;line-height:1.5;}
.stars-big{font-size:36px;letter-spacing:4px;}

/* ── HUD ── */
#hud{
  position:relative;z-index:10;
  width:100%;max-width:360px;
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 12px 4px;
}
.hud-block{text-align:center;}
.hud-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#7c5fac;}
.hud-val{font-family:'Fredoka One',cursive;font-size:22px;color:#e2d9f3;}

/* Timer bar */
#timerWrap{
  position:relative;z-index:10;
  width:100%;max-width:360px;height:5px;
  background:rgba(255,255,255,0.1);
  border-radius:3px;overflow:hidden;
  display:none;
}
#timerBar{height:100%;border-radius:3px;
  background:linear-gradient(90deg,#a855f7,#f0abfc);
  transition:width .1s linear,background .3s;
}

/* ── Canvas ── */
#gameWrap{position:relative;z-index:10;}
canvas{
  display:block;
  border-radius:16px;
  touch-action:none;
  box-shadow:0 0 40px rgba(167,139,250,0.3);
}

/* Cognitive hint */
#hint{
  position:relative;z-index:10;
  min-height:28px;
  font-size:13px;color:#8b7ea8;
  text-align:center;letter-spacing:.5px;
  max-width:360px;padding:2px 8px;
}

/* ── Next-bubble peek ── */
#nextWrap{
  position:relative;z-index:10;
  display:flex;align-items:center;gap:12px;
  padding:4px 8px;
}
.next-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#7c5fac;}
#nextCanvas{border-radius:8px;}

/* Combo flash */
#comboFlash{
  position:fixed;z-index:15;pointer-events:none;
  font-family:'Fredoka One',cursive;font-size:40px;
  color:#f0abfc;text-shadow:0 0 20px #a855f7;
  opacity:0;transition:opacity .1s;
  top:40%;left:50%;transform:translate(-50%,-50%);
}
</style>
</head>
<body>

<div id="stars"></div>

<!-- ── COMBO FLASH ── -->
<div id="comboFlash"></div>

<!-- ── START SCREEN ── -->
<div class="screen" id="startScreen">
  <div class="big-title">BUBBLE<br>SHOOTER</div>
  <div style="font-size:14px;color:#7c5fac;letter-spacing:2px;">KOGNITIV TRÄNING</div>

  <div class="level-grid" id="levelGrid"></div>

  <div style="font-size:12px;color:#4a3a6a;text-align:center;max-width:280px;margin-top:4px;">
    Matcha 3+ bubblor · Rensa brädan · Träna din hjärna
  </div>
</div>

<!-- ── WIN SCREEN ── -->
<div class="screen hidden" id="winScreen">
  <div class="result-title" id="winTitle" style="color:#f0abfc;">🎉 Bra jobbat!</div>
  <div class="stars-big" id="winStars"></div>
  <div class="result-sub" id="winText"></div>
  <button class="btn btn-primary" onclick="nextLevel()">Nästa nivå ▶</button>
  <button class="btn btn-secondary" onclick="replayLevel()">Spela om 🔄</button>
  <button class="btn btn-secondary" onclick="showStart()">Meny 🏠</button>
</div>

<!-- ── LOSE SCREEN ── -->
<div class="screen hidden" id="loseScreen">
  <div class="result-title" style="color:#f87171;">😅 Försök igen!</div>
  <div class="result-sub" id="loseText"></div>
  <button class="btn btn-primary" onclick="replayLevel()">Försök igen 🔄</button>
  <button class="btn btn-secondary" onclick="showStart()">Meny 🏠</button>
</div>

<!-- ── GAME UI ── -->
<div id="gameUI" style="display:none;flex-direction:column;align-items:center;width:100%;">
  <div id="hud">
    <div class="hud-block">
      <div class="hud-label">Nivå</div>
      <div class="hud-val" id="hudLevel">1</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Poäng</div>
      <div class="hud-val" id="hudScore">0</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Skott</div>
      <div class="hud-val" id="hudShots">∞</div>
    </div>
    <div class="hud-block" id="hudComboBlock" style="opacity:0;transition:opacity .3s;">
      <div class="hud-label">Combo</div>
      <div class="hud-val" id="hudCombo" style="color:#f0abfc;">x1</div>
    </div>
  </div>

  <div id="timerWrap"><div id="timerBar" style="width:100%"></div></div>

  <div id="gameWrap">
    <canvas id="game" width="360" height="560"></canvas>
  </div>

  <div id="nextWrap">
    <span class="next-label">Nästa:</span>
    <canvas id="nextCanvas" width="90" height="34"></canvas>
  </div>

  <div id="hint"></div>
</div>

/* ── Audio (generated) ── */
const AC = new (window.AudioContext||window.webkitAudioContext)();
function beep(freq,vol,dur,type="sine"){
  try{
    const o=AC.createOscillator(); const g=AC.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}
function sndShoot(){ beep(440,0.15,0.08,"square"); }
function sndPop(){
  beep(600,0.2,0.05);
  setTimeout(()=>beep(800,0.15,0.05),40);
  setTimeout(()=>beep(1000,0.1,0.08),80);
}
function sndFall(){ beep(300,0.2,0.15,"sawtooth"); setTimeout(()=>beep(180,0.15,0.2,"sawtooth"),80); }

const ALL_COLORS = ['blue','green','red','orange','purple','pink','brown'];

/* ── Build level select ── */
const savedStars = JSON.parse(localStorage.getItem("bs_stars")||"{}");

function buildLevelGrid(){
  const grid = document.getElementById("levelGrid");
  grid.innerHTML="";
  LEVEL_DEFS.forEach((lv,i)=>{
    const stars = savedStars[i]||0;
    const card = document.createElement("div");
    card.className="lvl-card";
    card.innerHTML=`<div class="num">${i+1}</div>
      <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
      <div style="font-size:11px;color:#a78bfa;margin-top:2px;">${lv.label}</div>
      <div class="tag">${lv.tag}</div>`;
    card.onclick=()=>startLevel(i);

/* ── Canvas setup ── */
const canvas  = document.getElementById("game");
const ctx     = canvas.getContext("2d");
const nextCvs = document.getElementById("nextCanvas");
const nCtx    = nextCvs.getContext("2d");

const W = canvas.width;
const H = canvas.height;

/* ── Constants ── */
const R     = 16;   // bubble radius
const COLS  = 10;
const ROWS  = 12;
const SPEED = 6;

/* ── Game state ── */
let levelIdx=0, levelDef;
let grid=[], fallingBubbles=[];
let shooter={x:W/2, y:H-38, color:"red"};
let queue=[];   // upcoming bubbles
let projectile=null;
let score=0, combo=1, shotsUsed=0;
let gameState="idle";   // idle | playing | over
let aiming=false, aimX=0, aimY=0;
let timerLeft=0, timerInterval=null;
let memHidden=false, memTimer=null;
let hintTimeout=null;

/* ── Helpers ── */
function randFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function getX(c,r){ return c*R*2 + R + (r%2)*R; }
function getY(r){ return r*R*1.75 + R + 2; }

function getActiveColors(){
  const used=new Set();
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(grid[r][c]) used.add(grid[r][c]);
  return used.size>0 ? [...used] : levelDef.colors.slice(0,levelDef.colors);
}

/* ── Level start ── */
function startLevel(idx){
  try{ AC.resume(); }catch(e){}
  levelIdx=idx;
  levelDef=LEVEL_DEFS[idx];

  const cols = ALL_COLORS.slice(0, levelDef.colors);

  // Build grid
  grid=[];
  for(let r=0;r<ROWS;r++){
    grid[r]=[];
    for(let c=0;c<COLS;c++){
      // Only fill top N rows, skip cells that would be off-screen on odd rows
      if(r<levelDef.filledRows){
        // Make patterns on higher levels
        if(levelIdx>=4 && r<2){
          // First 2 rows: alternating pattern for strategy challenge
          grid[r][c] = cols[(c + r) % cols.length];
        } else {
          grid[r][c] = randFrom(cols);
        }
      } else {
        grid[r][c]=null;
      }
    }
  }

  // Queue
  queue=[];
  for(let i=0;i<5;i++) queue.push(randFrom(cols));

  score=0; combo=1; shotsUsed=0;
  fallingBubbles=[];
  projectile=null;
  aiming=false;
  shooter={x:W/2, y:H-38, color:queue.shift()};
  gameState="playing";
  memHidden=false;

  // Show/hide timer bar
  const tw = document.getElementById("timerWrap");
  tw.style.display = levelDef.timePerShot>0 ? "block" : "none";
  if(levelDef.timePerShot>0) resetTimer();

  // Show game UI
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("winScreen").classList.add("hidden");
  document.getElementById("loseScreen").classList.add("hidden");
  document.getElementById("gameUI").style.display="flex";

  document.getElementById("hudLevel").textContent = idx+1;
  updateHUD();
  setHint();

  if(levelDef.memoryFlash && levelDef.showNext>0) scheduleMemFlash();
}

function setHint(){
  const hints=[
    "Sikta noga – matcha 3 eller fler!",
    "Kom ihåg: du kan studsa mot väggarna",
    "Planera – vilken färg kommer härnäst?",
    "Titta noga – kom ihåg kommande bubblor",
    "Skjut snabbt – klockan tickar!",
    "Reaktionsträning – var beredd!",
    "Expertläge – varje skott räknas",
    "Mästarläge – visa vad du går för!"
  ];
  document.getElementById("hint").textContent = hints[Math.min(levelIdx, hints.length-1)];
}

/* ── Timer ── */
function resetTimer(){
  clearInterval(timerInterval);
  timerLeft = levelDef.timePerShot;
  updateTimerBar();
  timerInterval = setInterval(()=>{
    if(gameState!=="playing"||!projectile===false) return;
    timerLeft -= 0.1;
    updateTimerBar();
    if(timerLeft<=1.5){
      document.getElementById("timerBar").style.background="linear-gradient(90deg,#ef4444,#fca5a5)";
      sndTick();
    }
    if(timerLeft<=0){
      // Force shoot in random direction if player didn't shoot
      if(!projectile && gameState==="playing"){
        forceShoot();
      }
    }
  },100);
}

function updateTimerBar(){
  const pct = Math.max(0,(timerLeft/levelDef.timePerShot)*100);
  document.getElementById("timerBar").style.width=pct+"%";
  if(timerLeft>levelDef.timePerShot*0.4)
    document.getElementById("timerBar").style.background="linear-gradient(90deg,#a855f7,#f0abfc)";
}

function forceShoot(){
  // Auto-shoot upward if time runs out
  const angle = -Math.PI/2 + (Math.random()-0.5)*0.8;
  launchProjectile(angle);
}

/* ── Memory flash ── */
function scheduleMemFlash(){
  if(memTimer) clearTimeout(memTimer);
  memHidden=false;
  // Show next bubbles for 1.5s then hide them
  memTimer=setTimeout(()=>{
    memHidden=true;
    // Re-show after 2s
    setTimeout(()=>{
      memHidden=false;
      scheduleMemFlash();
    },2000);
  },1500);
}

/* ── Queue management ── */
function refillQueue(){
  const cols = getActiveColors().length>0
    ? getActiveColors()
    : ALL_COLORS.slice(0,levelDef.colors);
  while(queue.length<5) queue.push(randFrom(cols));
}

/* ── Shooting ── */
function launchProjectile(angle){
  if(projectile || gameState!=="playing") return;
  // Don't allow shooting downward
  if(Math.sin(angle)>0.1) angle = angle < 0 ? -0.1 : Math.PI+0.1;

  projectile={
    x:shooter.x, y:shooter.y,
    dx:Math.cos(angle)*SPEED,
    dy:Math.sin(angle)*SPEED,
    color:shooter.color
  };
  sndShoot();
  shotsUsed++;

  refillQueue();
  shooter.color = queue.shift();
  updateHUD();
  aiming=false;

  if(levelDef.timePerShot>0) resetTimer();
  if(levelDef.memoryFlash && levelDef.showNext>0) scheduleMemFlash();
}

/* ── Input ── */
function getCanvasPos(e){
  const r=canvas.getBoundingClientRect();
  const src=e.touches?e.touches[0]:e;
  return { x:src.clientX-r.left, y:src.clientY-r.top };
}

canvas.addEventListener("pointerdown",e=>{
  if(gameState!=="playing"||projectile) return;
  try{AC.resume();}catch(ex){}
  aiming=true;
  const p=getCanvasPos(e);
  aimX=p.x; aimY=p.y;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{
  if(!aiming) return;
  const p=getCanvasPos(e);
  aimX=p.x; aimY=p.y;
});
canvas.addEventListener("pointerup",e=>{
  if(!aiming||!gameState==="playing") return;
  const p=getCanvasPos(e);
  aimX=p.x; aimY=p.y;
  if(Math.hypot(aimX-shooter.x,aimY-shooter.y)<15){ aiming=false; return; }
  const angle=Math.atan2(aimY-shooter.y, aimX-shooter.x);
  launchProjectile(angle);
});

/* ── Neighbors ── */
function getNeighbors(r,c){
  return r%2===0
    ? [[r,c-1],[r,c+1],[r-1,c-1],[r-1,c],[r+1,c-1],[r+1,c]]
    : [[r,c-1],[r,c+1],[r-1,c],[r-1,c+1],[r+1,c],[r+1,c+1]];
}

/* ── Snap & match ── */
function snapProjectile(p){
  if(!p) return;
  // Find nearest empty cell
  let best={dist:Infinity,r:0,c:0};
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(grid[r][c]) continue;
      const d=Math.hypot(p.x-getX(c,r), p.y-getY(r));
      if(d<best.dist) best={dist:d,r,c};
    }
  }
  let {r,c}=best;
  // safety: don't go below shooter
  if(getY(r)>shooter.y-R*2) r=Math.max(0,r-1);
  if(r<0)r=0;
  if(!grid[r]) grid[r]=[];
  grid[r][c]=p.color;
  removeMatches(r,c,p.color);
  checkDanger();
  checkWin();
  checkShotLimit();
}

function removeMatches(r,c,color){
  const visited=new Set(), stack=[[r,c]], matches=[];
  while(stack.length){
    const [cr,cc]=stack.pop();
    if(cr<0||cr>=ROWS||cc<0||cc>=COLS) continue;
    const key=cr+","+cc;
    if(visited.has(key)) continue;
    visited.add(key);
    if(grid[cr]&&grid[cr][cc]===color){
      matches.push([cr,cc]);
      getNeighbors(cr,cc).forEach(n=>stack.push(n));
    }
  }
  if(matches.length>=3){
    sndPop();
    const pts = matches.length * 10 * combo;
    score += pts;
    combo = Math.min(combo+1, 5);
    showCombo(combo, pts);
    matches.forEach(([rr,cc])=>{ grid[rr][cc]=null; });
    applyGravity();
  } else {
    combo=1;
  }
  updateHUD();
}

function applyGravity(){
  const visited=new Set();
  function mark(r,c){
    const stack=[[r,c]];
    while(stack.length){
      const [cr,cc]=stack.pop();
      if(cr<0||cr>=ROWS||cc<0||cc>=COLS) continue;
      const key=cr+","+cc;
      if(visited.has(key)||!grid[cr]||!grid[cr][cc]) continue;
      visited.add(key);
      getNeighbors(cr,cc).forEach(n=>stack.push(n));
    }
  }
  for(let c=0;c<COLS;c++) if(grid[0]&&grid[0][c]) mark(0,c);

  let didFall=false;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(grid[r]&&grid[r][c]&&!visited.has(r+","+c)){
        fallingBubbles.push({
          x:getX(c,r), y:getY(r),
          color:grid[r][c], vy:1.5+Math.random()*1.5
        });
        grid[r][c]=null;
        didFall=true;
      }
    }
  }
  if(didFall){ sndFall(); score+=fallingBubbles.length*5*combo; updateHUD(); }
}

/* ── Win / lose checks ── */
function checkDanger(){
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(grid[r][c] && getY(r)>H-90){
        endGame(false); return;
      }
    }
  }
}
function checkWin(){
  let any=false;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(grid[r][c]){ any=true; break; }
  if(!any) endGame(true);
}
function checkShotLimit(){
  if(levelDef.shotLimit>0 && shotsUsed>=levelDef.shotLimit){
    checkWin();
    if(gameState==="playing") endGame(false);
  }
}

function endGame(won){
  if(gameState!=="playing") return;
  gameState="over";
  clearInterval(timerInterval);
  clearTimeout(memTimer);

  if(won){
    sndWin();
    const stars = calcStars();
    if(stars>(savedStars[levelIdx]||0)){
      savedStars[levelIdx]=stars;
      localStorage.setItem("bs_stars",JSON.stringify(savedStars));
    }
    buildLevelGrid();
    document.getElementById("winTitle").textContent=
      levelIdx>=6?"🏆 Mästare!" : levelIdx>=4?"🌟 Utmärkt!" : "🎉 Bra jobbat!";
    document.getElementById("winStars").textContent="⭐".repeat(stars)+"☆".repeat(3-stars);
    document.getElementById("winText").innerHTML=
      `Poäng: <b>${score}</b><br>Skott använda: <b>${shotsUsed}</b><br>`
      +(levelIdx<LEVEL_DEFS.length-1?"Fortsätt till nästa nivå!":"Du har klarat alla nivåer! 🎊");
    document.getElementById("winScreen").classList.remove("hidden");
  } else {
    sndLose();
    document.getElementById("loseText").innerHTML=
      `Poäng: <b>${score}</b><br>Skott använda: <b>${shotsUsed}</b><br>Du klarar det nästa gång!`;
    document.getElementById("loseScreen").classList.remove("hidden");
  }
  document.getElementById("gameUI").style.display="none";
}

function calcStars(){
  if(levelDef.shotLimit===0) return 3;
  const ratio = shotsUsed/levelDef.shotLimit;
  if(ratio<0.5) return 3;
  if(ratio<0.75) return 2;
  return 1;
}

/* ── Navigation ── */
function showStart(){
  document.getElementById("startScreen").classList.remove("hidden");
  document.getElementById("winScreen").classList.add("hidden");
  document.getElementById("loseScreen").classList.add("hidden");
  document.getElementById("gameUI").style.display="none";
  gameState="idle";
  buildLevelGrid();
}
function nextLevel(){
  if(levelIdx<LEVEL_DEFS.length-1) startLevel(levelIdx+1);
  else showStart();
}
function replayLevel(){ startLevel(levelIdx); }

/* ── HUD ── */
function updateHUD(){
  document.getElementById("hudScore").textContent=score;
  document.getElementById("hudShots").textContent=
    levelDef&&levelDef.shotLimit>0
      ? `${shotsUsed}/${levelDef.shotLimit}`
      : shotsUsed;
  const cb=document.getElementById("hudComboBlock");
  if(combo>1){
    cb.style.opacity="1";
    document.getElementById("hudCombo").textContent="x"+combo;
  } else {
    cb.style.opacity="0";
  }
}

function showCombo(n, pts){
  if(n<=1) return;
  sndCombo(n);
  const el=document.getElementById("comboFlash");
  el.textContent=n>=5?"🔥 MAX COMBO!":n>=3?`💥 COMBO x${n}!`:`✨ x${n}`;
  el.style.opacity="1";
  setTimeout(()=>{ el.style.opacity="0"; },700);
}

/* ── Physics update ── */
function update(){
  if(gameState!=="playing") return;

  if(projectile){
    projectile.x+=projectile.dx;
    projectile.y+=projectile.dy;

    // Wall bounce
    if(projectile.x<R){ projectile.x=R; projectile.dx=Math.abs(projectile.dx); }
    if(projectile.x>W-R){ projectile.x=W-R; projectile.dx=-Math.abs(projectile.dx); }

    // Top wall → snap
    if(projectile.y<R+2){
      snapProjectile(projectile);
      projectile=null;
      return;
    }

    // Hit existing bubble
    let hit=false;
    outer:for(let r=0;r<ROWS&&!hit;r++){
      for(let c=0;c<COLS&&!hit;c++){
        if(!grid[r]||!grid[r][c]) continue;
        const d=Math.hypot(projectile.x-getX(c,r), projectile.y-getY(r));
        if(d<R*2-1){ snapProjectile(projectile); projectile=null; hit=true; }
      }
    }
  }

  // Falling bubbles gravity
  fallingBubbles.forEach(b=>{ b.y+=b.vy; b.vy+=0.35; });
  fallingBubbles=fallingBubbles.filter(b=>b.y<H+60);
}

/* ── Draw ── */
function drawBubble(ctx, name, x, y, r, alpha=1){
  if(alpha<1){ ctx.save(); ctx.globalAlpha=alpha; }
  const img=BUBBLE_IMG[name];
  if(img&&img.complete){
    ctx.drawImage(img, x-r, y-r, r*2, r*2);
  } else {
    // Fallback circle
    ctx.save();
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle="#888";
    ctx.fill();
    ctx.restore();
  }
  if(alpha<1) ctx.restore();
}

function drawAimGuide(){
  if(!aiming||!levelDef.aimGuide) return;
  const dx=aimX-shooter.x, dy=aimY-shooter.y;
  const len=Math.hypot(dx,dy);
  if(len<10) return;
  const nx=dx/len, ny=dy/len;
  // Draw dashed line with wall bounces (simulate)
  ctx.save();
  ctx.strokeStyle="rgba(255,255,255,0.35)";
  ctx.lineWidth=1.5;
  ctx.setLineDash([6,8]);
  let px=shooter.x, py=shooter.y;
  let vx=nx*SPEED*12, vy=ny*SPEED*12;
  ctx.beginPath();
  ctx.moveTo(px,py);
  for(let i=0;i<60;i++){
    px+=vx*0.5; py+=vy*0.5;
    if(px<R){ px=R; vx=Math.abs(vx); }
    if(px>W-R){ px=W-R; vx=-Math.abs(vx); }
    ctx.lineTo(px,py);
    if(py<20) break;
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawArrow(){
  if(!aiming) return;
  const dx=aimX-shooter.x, dy=aimY-shooter.y;
  if(Math.hypot(dx,dy)<15) return;
  ctx.save();
  ctx.strokeStyle="rgba(255,255,255,0.5)";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(shooter.x,shooter.y);
  ctx.lineTo(shooter.x+dx*0.5, shooter.y+dy*0.5);
  ctx.stroke();
  ctx.restore();
}

function drawGrid(){
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(grid[r]&&grid[r][c]){
        drawBubble(ctx, grid[r][c], getX(c,r), getY(r), R);
      }
    }
  }
}

function drawFalling(){
  fallingBubbles.forEach(b=>drawBubble(ctx, b.color, b.x, b.y, R));
}

function drawShooter(){
  drawBubble(ctx, shooter.color, shooter.x, shooter.y, R);
  // Subtle glow ring
  ctx.save();
  const pulse=0.5+0.5*Math.sin(Date.now()*0.005);
  ctx.strokeStyle=`rgba(255,255,255,${0.15+0.15*pulse})`;
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(shooter.x,shooter.y,R+4+pulse*3,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

function drawProjectile(){
  if(!projectile) return;
  drawBubble(ctx, projectile.color, projectile.x, projectile.y, R);
}

function drawNextQueue(){
  nCtx.clearRect(0,0,nextCvs.width,nextCvs.height);
  if(!levelDef) return;
  const n=levelDef.showNext;
  if(n===0){
    nCtx.fillStyle="#4a3a6a";
    nCtx.font="12px Nunito";
    nCtx.textAlign="center";
    nCtx.textBaseline="middle";
    nCtx.fillText("?",45,17);
    return;
  }
  const show = memHidden ? 0 : n;
  for(let i=0;i<n;i++){
    const x=14+i*26, y=17;
    const r=11-i*1.5;
    if(i<show && queue[i]){
      drawBubble(nCtx, queue[i], x, y, r, 1-i*0.15);
    } else {
      // Hidden: show question mark
      nCtx.save();
      nCtx.fillStyle="rgba(255,255,255,0.15)";
      nCtx.beginPath();
      nCtx.arc(x,y,r,0,Math.PI*2);
      nCtx.fill();
      nCtx.fillStyle="#6a5a8a";
      nCtx.font=`bold ${r}px Nunito`;
      nCtx.textAlign="center";
      nCtx.textBaseline="middle";
      nCtx.fillText("?",x,y+1);
      nCtx.restore();
    }
  }
}

// Danger zone line
function drawDangerLine(){
  ctx.save();
  ctx.strokeStyle="rgba(239,68,68,0.3)";
  ctx.lineWidth=1;
  ctx.setLineDash([6,6]);
  ctx.beginPath();
  ctx.moveTo(0,H-90); ctx.lineTo(W,H-90);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

/* ── Main loop ── */
function loop(){
  ctx.clearRect(0,0,W,H);
  if(gameState==="playing"){
    update();
    drawDangerLine();
    drawGrid();
    drawFalling();
    drawAimGuide();
    drawArrow();
    drawShooter();
    drawProjectile();
    drawNextQueue();
  }
  requestAnimationFrame(loop);
}

/* ── Init ── */
buildLevelGrid();
loop();
</script>
